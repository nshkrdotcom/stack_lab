services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stack_lab_multi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54339:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stack_lab_multi"]
      interval: 5s
      timeout: 5s
      retries: 10

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    volumes:
      - ../toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8574:8474"
      - "16432:15432"
    depends_on:
      postgres:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.124.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4417:4317"
      - "4418:4318"
