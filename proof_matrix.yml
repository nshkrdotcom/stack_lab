    receipt: receipt://stack_lab/phase_o_partial_snapshot/latest
    proves:
      - repo-local CI batch receipts and review summary machinery exist for deletion-campaign evidence
      - deletion work can be tied to reviewed batch receipts instead of unstructured notes
    does_not_prove:
      - duplicate DTOs and helpers have been removed across the ten repos
      - shared primitives have replaced repo-local copies
    next_action: run deletion-specific Phase H batches and attach explicit no-op receipts for consciously retained duplicates

