      <stop offset="0.5" stop-color="#151b34"/>
      <stop offset="1" stop-color="#080a12"/>
    </linearGradient>
    <linearGradient id="stacklab-liquid" x1="66" y1="72" x2="107" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8affd2"/>
      <stop offset="1" stop-color="#4db4ff"/>
    </linearGradient>
    <filter id="stacklab-shadow" x="-20%" y="-20%" width="140%" height="140%">
