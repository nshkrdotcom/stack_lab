<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="stacklab-title stacklab-desc">
  <title id="stacklab-title">StackLab</title>
  <desc id="stacklab-desc">A hexagonal proof laboratory with stacked repos, test flask, scenario matrix, receipt graph, and release evidence checks.</desc>
  <defs>
    <clipPath id="stacklab-hex">
